name: ShopEase release QA

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter test
      - run: flutter build web --release -t lib/main_admin.dart
      - uses: actions/upload-artifact@v4
        with:
          name: shopease-admin-web
          path: build/web/
          if-no-files-found: error

  android-demo-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release -t lib/main.dart
      - uses: actions/upload-artifact@v4
        with:
          name: shopease-customer-demo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
